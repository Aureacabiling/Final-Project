
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craigslist - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;
            color: #333;
        }

        /* Navigation bar */
        header {
            height: 36px;
            margin: 16px 1.5% 0;
            padding: 0 12px;
            border: 1px solid #d0c9d0;
            border-radius: 25px;
            background-color: #eee9ed;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-icons,
        .right-icons {
            display: flex;
            align-items: center;
            gap: 10px;
            color: purple;
            font-size: 23px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 5px;
            color: black;
            font-size: 18px;
            font-weight: bold;
        }

        .logo-symbol {
            color: purple;
            font-size: 27px;
        }

        .logo span:last-child {
            color: #850080;
        }

        .right-icons {
            font-size: 25px;
        }

        /* Search bar placeholders */
        .search-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 12px auto 36px;
            width: 84%;
        }

        .search-placeholder {
            height: 19px;
            background-color: #d9d9d9;
            border-radius: 20px;
            flex: 1;
        }

        .search-placeholder:first-child {
            flex: 1.8;
        }

        /* Main content */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8%;
            width: 83%;
            margin: 0 auto 46px;
        }

        /* Featured listing on the left */
        .featured {
            padding-top: 9px;
        }

        .featured-image {
            width: 100%;
            height: 200px;
            border: 1px solid #d5d5d5;
            background-color: #fcfcfc;
        }

        .featured-details {
            margin-top: 13px;
        }

        .featured-details div {
            height: 12px;
            margin-bottom: 8px;
            background-color: #e8cfe8;
        }

        .featured-details div:nth-child(n+4) {
            background-color: #d9d9d9;
        }

        /* Listing cards on the right */
        .listing-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 12%;
        }

        .listing-image {
            width: 100%;
            height: 100px;
            border: 1px solid #bdbdbd;
            background-color: #fff;
        }

        .listing-details {
            margin-top: 7px;
        }

        .listing-details div {
            height: 6px;
            margin-bottom: 4px;
            background-color: #d9d9d9;
        }

        /* Footer */
        footer {
            min-height: 92px;
            background-color: black;
            color: white;
            display: grid;
            grid-template-columns: 1.5fr 2fr 1.5fr;
            align-items: center;
            gap: 20px;
            padding: 20px 6%;
        }

        .footer-logo {
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
        }

        .footer-logo .symbol {
            color: purple;
            font-size: 27px;
            vertical-align: middle;
        }

        .footer-logo .name {
            color: #e6dce6;
        }

        .footer-logo .name span {
            color: #850080;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 9px;
            color: #d5d5d5;
        }

        .footer-description {
            font-size: 8px;
            line-height: 1.4;
            color: #bdbdbd;
        }

        /* Adjust the layout for smaller screens */
        @media (max-width: 650px) {
            .search-bar {
                gap: 8px;
                width: 90%;
            }

            .search-placeholder:nth-child(n+4) {
                display: none;
            }

            main {
                grid-template-columns: 1fr;
                width: 85%;
                gap: 30px;
            }

            .listing-grid {
                gap: 20px;
            }

            footer {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .footer-links {
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->

            <article class="listing">

</html>
