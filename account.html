
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craigslist Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;
            border: 2px solid #333;
            min-height: 100vh;
        }

        /* Header */
        header {
            height: 33px;
            margin: 14px 12px 0;
            padding: 0 10px;
            border: 1px solid #d0c9d0;
            border-radius: 25px;
            background-color: #eee9ed;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-icons,
        .right-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #92008b;
            font-size: 23px;
        }

        .logo {
            font-size: 17px;
            font-weight: bold;
            color: black;
        }

        .logo span {
            color: #92008b;
        }

        /* Main profile container */
        .profile-container {
            background-color: black;
            margin: 25px 4.2%;
            height: 442px;
            border-radius: 18px;
            padding: 34px 36px;
            color: white;
        }

        /* Profile information */
        .profile-info {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .profile-icon {
            width: 70px;
            height: 70px;
            background-color: white;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
        }

        .profile-icon::before {
            content: "";
            position: absolute;
            width: 21px;
            height: 21px;
            background-color: black;
            border-radius: 50%;
            top: 17px;
            left: 25px;
        }

        .profile-icon::after {
            content: "";
            position: absolute;
            width: 39px;
            height: 19px;
            background-color: black;
            border-radius: 50% 50% 40% 40%;
            bottom: 8px;
            left: 15px;
        }

        .profile-text h2 {
            color: #92008b;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .profile-text p {
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        /* Order sections */
        .orders {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9.5%;
            margin-top: 64px;
        }

        .order-section h3 {
            color: #92008b;
            font-size: 11px;
            margin: 0 0 6px 9px;
        }

        .order-box {
            height: 220px;
            width: 100%;
            background-color: white;
            border-radius: 17px;
        }

        /* Smaller screens */
        @media (max-width: 600px) {
            .profile-container {
                height: auto;
                margin: 20px 4%;
                padding: 25px 18px;
            }

            .profile-info {
                gap: 15px;
            }

            .profile-text h2 {
                font-size: 12px;
            }

            .orders {
                gap: 12px;
                margin-top: 45px;
            }

            .order-section h3 {
                font-size: 9px;
                margin-left: 2px;
            }

            .order-box {
                height: 300px;
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="left-icons">
            <span>◉</span>
            <span>▱</span>
        </div>

        <div class="logo">☮ craigslist<span></span></div>

        <div class="right-icons">
            <span>☆</span>
            <span>☰</span>
        </div>
    </header>

    <main class="profile-container">

        <section class="profile-info">
            <div class="profile-icon"></div>

            <div class="profile-text">
                <h2>MARIA KATARINA EUNICE ELOISE SARMIENTO</h2>
                <p>AGE | GMAIL | NO.</p>
            </div>
        </section>

        <section class="orders">

            <div class="order-section">
                <h3>IN BASKET</h3>
                <div class="order-box"></div>
            </div>

            <div class="order-section">
                <h3>ONGOING</h3>
                <div class="order-box"></div>
            </div>

            <div class="order-section">
                <h3>RECEIVED</h3>
                <div class="order-box"></div>
            </div>

        </section>

    </main>

</body>
</html>
